name: Thargrid Phaser preview verification and vendor
on:
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'data.js'
      - 'sw.js'
      - 'tests/**'
      - 'phaser-preview/**'
      - '.github/workflows/phaser-preview.yml'
  pull_request:
    paths:
      - 'app.js'
      - 'data.js'
      - 'sw.js'
      - 'tests/**'
      - 'phaser-preview/**'
      - '.github/workflows/phaser-preview.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check app.js
          node --check data.js
          node --check sw.js
          node --check phaser-preview/bridge.js
          node --check phaser-preview/sw.js
      - name: Regression and save isolation
        run: node --test tests/*.test.cjs
      - name: Fetch locally hosted Phaser 4.2.1
        run: |
          npm install --no-save --ignore-scripts --no-fund --no-audit phaser@4.2.1
          test -s node_modules/phaser/dist/phaser.min.js
          mkdir -p phaser-preview/vendor
          cp node_modules/phaser/dist/phaser.min.js phaser-preview/vendor/phaser.min.js
          test -s phaser-preview/vendor/phaser.min.js
      - name: Upload tested Phaser vendor
        uses: actions/upload-artifact@v4
        with:
          name: thargrid-phaser-vendor
          path: phaser-preview/vendor/phaser.min.js
          retention-days: 7
      - name: Commit tested Phaser vendor into Pages branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add phaser-preview/vendor/phaser.min.js
          if git diff --cached --quiet; then
            echo "Phaser vendor already at pinned version"
          else
            git commit -m "build: vendor Phaser 4.2.1 for offline beta"
            git push origin HEAD:main
          fi
